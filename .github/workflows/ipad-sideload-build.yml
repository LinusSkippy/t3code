name: iPad Sideload Build

# Builds an unsigned Release .ipa for sideloading (Sideloadly/AltStore re-sign it
# with a free Apple ID). Personal Team mode drops extensions and entitlements a
# free account cannot sign.
on:
  push:
    branches:
      - t3/ipad-sideload-build

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=8192
  APP_VARIANT: production
  T3CODE_IOS_PERSONAL_TEAM: "1"
  T3CODE_IOS_PERSONAL_TEAM_BUNDLE_ID: com.linusskippy.t3code
  EXPO_NO_GIT_STATUS: "1"
  CI: "1"

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Xcode version
        run: xcodebuild -version

      - name: Prebuild
        working-directory: apps/mobile
        run: vp exec expo prebuild --clean --platform ios

      - name: Build unsigned Release app
        working-directory: apps/mobile/ios
        run: |
          workspace="$(ls -d *.xcworkspace | head -1)"
          scheme="$(xcodebuild -workspace "$workspace" -list -json | node -e 'const j=JSON.parse(require("fs").readFileSync(0));const w=j.workspace.schemes;const ws=require("path").basename(process.argv[1],".xcworkspace");console.log(w.includes(ws)?ws:w[0])' "$workspace")"
          echo "workspace=$workspace scheme=$scheme"
          set -o pipefail
          xcodebuild -workspace "$workspace" -scheme "$scheme" \
            -configuration Release -sdk iphoneos -destination generic/platform=iOS \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test "${PIPESTATUS[0]}" -eq 0

      - name: Package .ipa
        working-directory: apps/mobile/ios
        run: |
          app="$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)"
          plutil -p "$app/Info.plist" | grep -E "MinimumOSVersion|CFBundleIdentifier"
          mkdir -p Payload && cp -R "$app" Payload/
          zip -qry T3Code-iPadOS17.ipa Payload
          ls -lh T3Code-iPadOS17.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v7
        with:
          name: T3Code-iPadOS17-ipa
          path: apps/mobile/ios/T3Code-iPadOS17.ipa
          retention-days: 14

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: apps/mobile/ios/xcodebuild.log
          if-no-files-found: ignore
